<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 286" role="img" aria-labelledby="t d"><title id="t">Windows Server Health Report workflow</title><desc id="d">Read Windows CIM data, classify checks as OK, Warning, Critical or Unknown, then write local HTML and JSON reports.</desc><rect width="1200" height="286" rx="18" fill="#0b1527"/><g font-family="Arial,sans-serif"><text x="36" y="44" fill="#54ddc7" font-size="14" letter-spacing="2">POWERSHELL / READ-ONLY COLLECTION</text><g stroke="#56809a" stroke-width="2"><path d="M300 151H344m-10-6 10 6-10 6M620 151H664m-10-6 10 6-10 6M940 151H984m-10-6 10 6-10 6" fill="none"/></g><g><rect x="30" y="86" width="270" height="128" rx="12" fill="#14253a" stroke="#32475d"/><rect x="30" y="104" width="4" height="24" fill="#4bdbc5"/><text x="52" y="122" fill="#f0f6fc" font-size="20" font-weight="700">Windows CIM</text><text x="52" y="150" fill="#aec1d3" font-size="16">Memory · Fixed disks</text><text x="52" y="173" fill="#aec1d3" font-size="16">Selected services</text></g><g><rect x="344" y="86" width="276" height="128" rx="12" fill="#14253a" stroke="#32475d"/><rect x="344" y="104" width="4" height="24" fill="#4bdbc5"/><text x="366" y="122" fill="#f0f6fc" font-size="20" font-weight="700">Evaluate</text><text x="366" y="150" fill="#aec1d3" font-size="16">Operator thresholds</text><text x="366" y="173" fill="#aec1d3" font-size="16">Errors stay Unknown</text></g><g><rect x="664" y="86" width="276" height="128" rx="12" fill="#14253a" stroke="#32475d"/><rect x="664" y="104" width="4" height="24" fill="#4bdbc5"/><text x="686" y="122" fill="#f0f6fc" font-size="20" font-weight="700">Report</text><text x="686" y="150" fill="#aec1d3" font-size="16">HTML for people</text><text x="686" y="173" fill="#aec1d3" font-size="16">JSON for automation</text></g><text x="1000" y="139" fill="#f0f6fc" font-size="20" font-weight="700">Review</text><text x="1000" y="168" fill="#aec1d3" font-size="16">Local files</text><text x="36" y="255" fill="#8ba8bf" font-size="14">No service restarts, configuration changes, or remote-access changes.</text></g></svg>
