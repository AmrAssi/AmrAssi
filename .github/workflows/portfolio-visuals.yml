name: Portfolio visuals
on:
  push:
    paths:
      - 'assets/headers/**'
      - 'scripts/capture-visuals.mjs'
      - '.github/workflows/portfolio-visuals.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install browser tools
        run: npm install --no-save --ignore-scripts playwright@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate banners and capture project screenshots
        run: node scripts/capture-visuals.mjs
