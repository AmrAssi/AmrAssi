<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Enterprise Home Lab — logical architecture</title><desc id="d">VMware ESXi hosts segmented Windows roles. pfSense controls lab networks. Active Directory supports clients. An offline root CA signs an issuing CA. Entra ID and Intune represent hybrid device management. Veeam provides backup workflows.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#56809a"/></marker></defs><rect width="1200" height="760" rx="18" fill="#0b1527"/><g font-family="Arial,sans-serif"><text x="40" y="49" fill="#54ddc7" font-size="14" letter-spacing="2">AMR ASSI / HOME LAB</text><text x="40" y="90" fill="#f0f6fc" font-size="32" font-weight="700">Windows infrastructure, connected.</text><text x="40" y="123" fill="#9fb6ca" font-size="17">Logical roles and dependencies · Not a live network or IP inventory</text>
